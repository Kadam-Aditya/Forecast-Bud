{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="main-content-container mt-4 {% if has_error %}blur-background{% endif %}">

  <!-- SOURCE SELECT -->
  <div class="container">
    <div class="row mb-4">
      <div class="col-md-6 mx-auto">
        <form method="get" action="{% url 'Finance News' %}">
          <label class="form-label fw-bold">Choose News Source</label>
          <select id="news-source" name="news-source" class="form-select modern-select" onchange="this.form.submit()">
            <option value="">Select</option>
            <option value="associated-press" {% if selected_source == 'associated-press' %}selected{% endif %}>Associated Press</option>
            <option value="bbc-news" {% if selected_source == 'bbc-news' %}selected{% endif %}>BBC News</option>
            <option value="bloomberg" {% if selected_source == 'bloomberg' %}selected{% endif %}>Bloomberg</option>
            <option value="business-insider" {% if selected_source == 'business-insider' %}selected{% endif %}>Business Insider</option>
            <option value="crypto-coins-news" {% if selected_source == 'crypto-coins-news' %}selected{% endif %}>Crypto Coins News</option>
            <option value="fox-news" {% if selected_source == 'fox-news' %}selected{% endif %}>Fox News</option>
            <option value="fortune" {% if selected_source == 'fortune' %}selected{% endif %}>Fortune</option>
          </select>
        </form>
      </div>
    </div>

    <!-- TITLE -->
    <h1 class="headline-title text-center">📰 Latest Headlines</h1>

    <!-- BANNER -->
    <div class="text-center mb-4">
      <img src="{% static 'img/FN_IMG.jpg' %}" class="banner-image">
    </div>

    <!-- NEWS GRID -->
    <div class="news-container">
      {% for news, des, image in mylist %}
        <div class="news-card">
          <div class="image-wrapper">
            <img src="{{ image }}" alt="{{ news }}">
          </div>

          <div class="card-content">
            <h3 class="news-title">{{ news }}</h3>
            <p class="news-description">{{ des }}</p>

            <a href="#" class="read-btn">Read More →</a>
          </div>
        </div>
      {% endfor %}
    </div>

  </div>
</div>

<!-- ERROR OVERLAY -->
{% if has_error %}
<div class="error-overlay">
  <div class="error-box">
    <button class="close-button" onclick="location.href='{% url 'Budget Planner' %}'">&times;</button>
    <h4>Premium Feature</h4>
    <p>Subscribe to access this feature.</p>
    <button class="btn-modern">Upgrade Plan</button>
  </div>
</div>
{% endif %}

<style>
/* BACKGROUND */
body {
  background: linear-gradient(to right, #eef2f3, #ffffff);
  font-family: 'Segoe UI', sans-serif;
}

/* TITLE */
.headline-title {
  font-weight: 700;
  margin-bottom: 20px;
}

/* SELECT */
.modern-select {
  border-radius: 10px;
  padding: 10px;
}

/* BANNER */
.banner-image {
  width: 100%;
  max-width: 900px;
  height: 350px;
  object-fit: cover;
  border-radius: 12px;
}

/* GRID */
.news-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

/* CARD */
.news-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
}

.news-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* IMAGE */
.image-wrapper img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

/* CONTENT */
.card-content {
  padding: 15px;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.news-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 10px;
}

.news-description {
  font-size: 14px;
  color: #555;
  flex-grow: 1;
}

/* BUTTON */
.read-btn {
  text-decoration: none;
  font-weight: 600;
  color: #007bff;
  margin-top: 10px;
}

.read-btn:hover {
  text-decoration: underline;
}

/* RESPONSIVE */
@media (max-width: 992px) {
  .news-container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 576px) {
  .news-container {
    grid-template-columns: 1fr;
  }
}

/* BLUR */
.blur-background {
  filter: blur(6px);
  pointer-events: none;
}

/* ERROR OVERLAY */
.error-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
}

.error-box {
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  backdrop-filter: blur(10px);
  position: relative;
}

/* BUTTON */
.btn-modern {
  background: #007bff;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
}

/* CLOSE */
.close-button {
  position: absolute;
  top: 8px;
  right: 15px;
  border: none;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
}
</style>

{% endblock %}
